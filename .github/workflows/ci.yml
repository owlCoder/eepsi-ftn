name: Quality gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eepsi
          MYSQL_USER: eepsi
          MYSQL_PASSWORD: eepsi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://eepsi:eepsi@127.0.0.1:3306/eepsi
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: eepsi
      DATABASE_PASSWORD: eepsi
      DATABASE_NAME: eepsi
      NEXTAUTH_SECRET: ci-placeholder-only-not-for-production-123456789
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate schema
        run: npx prisma validate
      - name: Apply versioned MySQL migrations
        run: npx prisma migrate deploy
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

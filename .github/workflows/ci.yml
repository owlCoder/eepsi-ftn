name: Quality gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eepsi
          MYSQL_USER: eepsi
          MYSQL_PASSWORD: eepsi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://eepsi:eepsi@127.0.0.1:3306/eepsi
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: eepsi
      DATABASE_PASSWORD: eepsi
      DATABASE_NAME: eepsi
      NEXTAUTH_SECRET: ci-placeholder-only-not-for-production-123456789
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Validate local Docker Compose configuration
        run: docker compose config --quiet
      - name: Validate schema
        run: npx prisma validate
      - name: Apply versioned MySQL migrations
        run: npx prisma migrate deploy
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Database integration tests
        run: npm run test:integration
      - name: Production build
        run: npm run build
      - name: Install E2E browser
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (synthetic accounts, isolated MySQL)
        env:
          E2E_TEST_MODE: "true"
        shell: bash
        run: |
          set -euo pipefail
          export E2E_TEST_PASSWORD="$(openssl rand -hex 24)"
          npm run test:e2e
      - name: Runtime smoke checks (production server)
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3000 > /tmp/eepsi-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3000/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/eepsi-start.log
            exit 1
          fi
          for path in / /o-katedri /istrazivanje /saradnja /laboratorija /predmeti /nastavnici /novosti /prijava /robots.txt /sitemap.xml /api/auth/providers; do
            curl --fail --silent --show-error "http://localhost:3000$path" > /dev/null
          done
          curl --fail --silent --show-error "http://localhost:3000/predmeti?level=OAS&semester=2" > /dev/null
          # App Router may stream the shell with HTTP 200 and then send a
          # NEXT_REDIRECT instruction from the protected async layout.
          code="$(curl --silent -o /tmp/eepsi-admin.html -w '%{http_code}' http://localhost:3000/admin)"
          case "$code" in
            302|303|307|308)
              echo "Unauthenticated /admin redirected via HTTP $code" ;;
            200)
              if grep -q "NEXT_REDIRECT" /tmp/eepsi-admin.html; then
                echo "Unauthenticated /admin redirected via RSC stream"
              else
                echo "Unauthenticated /admin returned 200 without a server redirect" >&2
                exit 1
              fi ;;
            *)
              echo "Unauthenticated /admin unexpected status: $code" >&2
              exit 1 ;;
          esac

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
